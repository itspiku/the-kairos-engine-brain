name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies (no llama-cpp-python for CI)
      run: |
        python -m pip install --upgrade pip
        # Install without llama-cpp-python (requires model file not available in CI)
        grep -v "llama-cpp-python" requirements.txt > ci_requirements.txt
        pip install -r ci_requirements.txt
        pip install pytest pytest-cov ruff mypy

    - name: Lint with ruff
      run: |
        ruff check src/ tests/ main.py build_crash_predictor.py || true

    - name: Train XGBoost crash predictor
      run: |
        python build_crash_predictor.py
      env:
        PYTHONPATH: .

    - name: Run fast tests (no LLM required)
      run: |
        python -m pytest tests/ \
          --ignore=tests/test_risk_model.py \
          -v --tb=short \
          -k "not test_model_file_exists and not test_classify_risk"
      env:
        PYTHONPATH: .

    - name: Run risk model tests (model built above)
      run: |
        python -m pytest tests/test_risk_model.py -v --tb=short
      env:
        PYTHONPATH: .

    - name: Run integration tests (no LLM)
      run: |
        python -m pytest tests/test_integration.py -v --tb=short \
          -k "not test_risk_pipeline_consistent"
      env:
        PYTHONPATH: .

    - name: Upload coverage report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
    - run: pip install ruff mypy
    - name: Ruff lint
      run: ruff check src/ tests/ main.py || true
    - name: Mypy type check
      run: mypy src/ --ignore-missing-imports --no-strict-optional || true
